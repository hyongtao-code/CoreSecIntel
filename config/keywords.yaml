# ============================================================================
# 关键词库与评分配置
#
# 关键词用于第一阶段召回（大模型分类之前的成本控制）。
# 匹配规则：
#   - 大小写不敏感
#   - 多词短语中间允许出现空格 / 连字符 / 下划线
#   - 纯拉丁短缩写（MAP / SIP / IMS 等）要求全大写才匹配，避免误命中
#     roadmap / relationship 之类的普通英文单词
#   - 中文关键词按普通子串匹配
#
# 命中标题的权重高于命中摘要。
# ============================================================================

keywords:

  # 命中数量下限（达到该数量才进入大模型分类阶段）
  min_matches: 1

  # 权重
  title_weight: 3.0
  abstract_weight: 1.0

  # ------------------------------------------------------------------
  # 核心网信令协议
  # ------------------------------------------------------------------
  protocols:
    - SS7
    - MAP
    - TCAP
    - SCCP
    - SIGTRAN
    - GTP-C
    - GTP-U
    - PFCP
    - SIP
    - IMS
    - NAS
    - NGAP
    - S1AP
    - SBA
    - 5G Core
    - 5G SBA
    - HTTP/2-based SBI
    - Mobile Core Network
    - Evolved Packet Core

  # ------------------------------------------------------------------
  # 有歧义的关键词
  #
  # 这些词在学术/工程文献中常有完全无关的含义
  # （Diameter 可指几何直径、纳米棒直径；MAP 可指映射 / 地图；
  #   IMS 可指车载信息娱乐系统；NAS 可指网络附属存储），
  # 因此必须同时命中下方 context_keywords 中的电信语境词，
  # 才计为有效召回，避免把材料科学 / 生物学的论文拉进报告。
  # ------------------------------------------------------------------
  ambiguous:
    - Diameter
    - DRA
    - DEA
    - MAP

  # 电信语境标志词（用于确认歧义关键词、以及漏洞条目确实指向电信领域）
  context_keywords:
    # 协议与接口
    - SS7
    - GTP-C
    - GTP-U
    - PFCP
    - SIP
    - IMS
    - NAS
    - NGAP
    - S1AP
    - 5G Core
    - 5G SBA
    - Diameter
    - Diameter protocol
    - TCAP
    - SCCP
    - SIGTRAN
    - MAP protocol
    - Mobile Core Network
    - Evolved Packet Core
    - SIP
    - RADIUS
    - GTP
    - Diameter Base
    - Sh interface
    - Gn interface
    - N8 interface
    - N6 interface
    # 架构与网元
    - mobile core
    - core network
    - telecom
    - cellular
    - LTE
    - roaming
    - interworking
    - signaling
    - signalling
    - subscriber
    - IMSI
    - base station
    - carrier
    - operator
    - RAN
    - vRAN
    - Open RAN
    - HSS
    - MME
    - AMF
    - SMF
    - UPF
    - AUDF
    - AUSF
    - UDM
    - UDR
    - PCRF
    - PCF
    - NRF
    - SCP
    - MSC
    - HLR
    - VLR
    - MMSC
    - SCEF
    - PGW
    - SGW
    # 电信业务与攻击面
    - telecom fraud
    - toll fraud
    - SMS fraud
    - call interception
    - call hijacking
    - SS7 attack
    - signaling attack
    - signaling firewall
    - mobile network attack
    - mobile subscriber
    - SIM card
    - eSIM
    - SIM swap
    - location tracking
    - location privacy
    - IMSI catcher
    - fake base station
    - rogue base station
    - lawful intercept
    - emergency call
    - 911
    - VoLTE
