    - network slicing
    - private 5G
    - MEC
    - mobile network operator
    - MNO
    - MVNO
    - wireline
    - PSTN
    - ISDN
    - media gateway
    - softswitch
    - SIP trunk
    - IPBX

  # ------------------------------------------------------------------
  # 核心网网元
  # ------------------------------------------------------------------
  network_elements:
    - MME
    - HSS
    - PCRF
    - SGW
    - PGW
    - AMF
    - SMF
    - UPF
    - AUSF
    - UDM
    - UDR
    - PCF
    - NRF
    - NSSF
    - MSC
    - HLR
    - VLR
    - SCEF
    - MMSC
    - SCP

  # ------------------------------------------------------------------
  # 攻击类型
  # ------------------------------------------------------------------
  # 注意：这里只放**电信语境专用**的攻击类型表述。
  # "denial of service" / "authentication bypass" 这类通用安全术语
  # 会把大量与电信无关的 CVE 和论文拉进报告，因此不放在这里——
  # 它们由 context_keywords 的电信语境判定来间接支撑。
  attack_types:
    - signaling attack
    - signalling attack
    - signaling security
    - signalling security
    - protocol abuse
    - protocol fuzzing
    - protocol vulnerability
    - message injection
    - signaling spoofing
    - signaling replay
    - location tracking
    - location leakage
    - IMSI catcher
    - fake base station
    - base station spoofing
    - SMS interception
    - call hijacking
    - rogue base station
    - interworking attack
    - traffic diversion
    - subscriber privacy
    - subscriber data leak
    - mobile network attack
    - carrier network attack
    - telecom fraud
    - SIM swap
    - signaling firewall
    - mobile core network security
    - roaming security
    - interconnect security
    - operator security
    - 5G security
    - LTE security

  # ------------------------------------------------------------------
  # 主题词（研究方法、检测技术、前沿方向）
  # ------------------------------------------------------------------
  topics:
    - telecom security
    - core network security
    - signaling firewall
    - formal verification
    - protocol implementation security
    - attack surface analysis
    - machine learning
    - deep learning
    - graph neural network
    - threat intelligence
    - large language model
    - AI-assisted vulnerability discovery
    - fuzzing campaign
    - semantic analysis
    - traffic analysis
    - network function virtualization
    - network slicing security
    - private 5G security
    - Open RAN security
    - MEC security

  # ------------------------------------------------------------------
  # 中文关键词
  # ------------------------------------------------------------------
  chinese_keywords:
    - 信令安全
    - 信令攻击
    - 核心网
    - 核心网安全
    - 信令防火墙
    - 漫游攻击
    - 协议漏洞
    - 协议模糊测试
    - 运营商安全
    - 用户位置隐私
    - IMSI
    - 鉴权绕过
    - 电信安全
    - 5G核心网
    - 网络切片安全
    - 电信欺诈

  # ------------------------------------------------------------------
  # 排除词（命中即排除，优先级最高）
  # 目的：避免退化成泛网络安全新闻聚合器
  # ------------------------------------------------------------------
  exclusions:
    - ransomware
    - phishing attack
    - cryptojacking
    - botnet
    - browser exploit
    - web application security
    - cloud misconfiguration
    - kubernetes cluster
    - supply chain compromise
    - data breach at retail
    - consumer password
    - home router
    - smart home device
    - antivirus
    - malware analysis
    - 勒索软件
    - 钓鱼攻击

# ============================================================================
# 评分配置
# ============================================================================
scoring:
  # 综合评分 0-100 的权重（总和应为 1.0）
  weights:
    relevance: 0.40       # 专业相关性
    novelty: 0.25         # 技术新颖性
    impact: 0.20          # 安全影响和威胁程度
    source_trust: 0.15    # 来源可信度

  # 低于该分数的条目不纳入邮件
  min_score: 45.0

  # 邮件中最多纳入的条目数
  max_items: 30
