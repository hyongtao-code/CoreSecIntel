# ============================================================================
# 周期调度配置
#
# 由 `python3 app.py serve` 读取。
#
# frequency:
#   daily   —— 每天一次
#   weekly  —— 每周一次（weekday 指定星期几）
#   monthly —— 每月一次（day_of_month 指定几号）
#
# run_at: 触发时刻 HH:MM（24 小时制，按 timezone 解释）
#
# 每次任务都会：采集 → 分析 → 生成报告 → 归档到 data/archive/ → 发邮件。
# HTTP 页面读取 data/archive/ 展示历史各期，不依赖数据库。
# ============================================================================

schedule:
  # 是否启用周期调度
  enabled: true

  # daily / weekly / monthly
  frequency: weekly

  # 触发时刻
  run_at: "08:30"

  # weekly 专用：星期几（monday..sunday）
  weekday: monday

  # monthly 专用：每月第几日（1-31，超出当月天数时取当月最后一天）
  day_of_month: 1

  # 时区
  timezone: Asia/Shanghai

  # 启动时若已错过当期，是否立即补跑一次
  catch_up: false

  # 某次任务失败后是否继续等待下一次（false 则停止调度）
  continue_on_error: true

# ============================================================================
# HTTP 服务配置
# ============================================================================
web:
  # 是否启用 HTTP 服务
  enabled: true

  # 监听地址。
  #   0.0.0.0 —— 对外可访问（局域网内浏览器直接输 http://<本机IP>/ 即可）
  #   127.0.0.1 —— 仅本机可访问
  # 如需限制访问，请在防火墙层面做控制。
  host: 0.0.0.0

  # 监听端口
  # 80 是 HTTP 标准端口，浏览器直接输 IP 就能访问，无需记端口号。
  # 绑定 80 需要 root 或 CAP_NET_BIND_SERVICE 能力；
  # 无权限时会自动降级到 8080，再不行降到 8765。
  port: 80

  # 列表页每页显示多少期
  page_size: 10
